name: 同步上游 yuhangch

# 每周自动把上游 yuhangch/yuhang.ch 的更新合并过来：
# - 始终保留你的私有内容指针(src/content)与子模块配置，绝不引入上游内容
# - 有实际代码改动 → 开 PR（Vercel 会自动出预览，你确认后合并）
# - 出现真冲突 → 开 issue 提醒（可让 Claude 帮忙解决）
# - 仅上游内容变化 → 跳过
# 也可在 Actions 页面手动点 “Run workflow” 触发。

on:
  schedule:
    - cron: '0 18 * * 0'   # 每周日 18:00 UTC（北京时间周一 02:00）
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CONTENT_DEPLOY_TOKEN }}

      - name: 合并上游并按需开 PR / issue
        env:
          GH_TOKEN: ${{ secrets.CONTENT_DEPLOY_TOKEN }}
          # 强制所有 gh 命令打到本 fork：脚本加了名为 upstream 的 remote，
          # gh 会把它当 PR 目标仓库（fork 特殊处理），导致 PR/issue 建到上游 yuhangch 去而失败。
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/yuhangch/yuhang.ch.git 2>/dev/null || true
          git fetch upstream main

          # 上游没有新提交就退出
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "已是最新，无需同步。"
            exit 0
          fi

          git checkout -B sync/upstream origin/main

          # 尝试合并（冲突不让脚本中断）
          git merge --no-edit upstream/main || true

          # src/content 恒为我方子模块：上游把它当普通目录带示例内容，会产生
          # file/directory 与 modify/delete 冲突（git 会把上游版本挪到 src/content~HEAD）。
          # 无论如何都把它恢复成我方 gitlink，并清掉上游塞进来的一切内容文件。
          rm -rf 'src/content~HEAD' 2>/dev/null || true
          git rm -rf --cached --ignore-unmatch -q -- 'src/content~HEAD' >/dev/null 2>&1 || true
          if git ls-files -u -- src/content | grep -q .; then
            git rm -rf --cached --ignore-unmatch -q -- src/content >/dev/null 2>&1 || true
            git restore --source=HEAD --staged -- src/content 2>/dev/null \
              || git checkout HEAD -- src/content 2>/dev/null || true
            git add -- src/content 2>/dev/null || true
          fi
          git clean -fdq -- src/content >/dev/null 2>&1 || true

          # 始终保留“我们的”子模块配置（绝不要上游对它的改动）
          if git ls-files -u -- .gitmodules | grep -q .; then
            git checkout --ours -- .gitmodules && git add -- .gitmodules
          fi

          # 还有其它冲突 → 不静默跳过、也不依赖 Issues：把带冲突标记的合并提交并推分支、
          # 开/更新一个"⚠️需手动解决"的 PR，这样你在 PR 列表一定看得到（可让 Claude 拉
          # sync/upstream 分支解决冲突后再合并）。
          REMAIN="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$REMAIN" ]; then
            LIST="$(echo "$REMAIN" | sed 's/^/- /')"
            git add -A
            git commit -m "🔄 同步上游 yuhangch/yuhang.ch（含未解决冲突，待手动处理）" || true
            git push -f origin sync/upstream
            CONFLICT_BODY="$(printf '⚠️ 自动同步上游 yuhangch/yuhang.ch 时有冲突。已把【带冲突标记】的合并推到本分支，请手动解决后再合并（可让 Claude 拉 sync/upstream 分支解决）。\n\n冲突文件：\n%s\n\n注意：本分支含 <<<<<<< 冲突标记，未解决前请勿直接 Merge。' "$LIST")"
            if gh pr view sync/upstream >/dev/null 2>&1; then
              gh pr edit sync/upstream --title "⚠️ 同步上游 yuhangch（有冲突，需手动解决）" --body "$CONFLICT_BODY"
            else
              gh pr create --base main --head sync/upstream --title "⚠️ 同步上游 yuhangch（有冲突，需手动解决）" --body "$CONFLICT_BODY"
            fi
            echo "有冲突，已推分支并开/更新 PR（待手动解决）。"
            exit 0
          fi

          # 完成合并提交（若仍在合并中）
          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          fi

          # 除内容指针外没有实际改动 → 仅上游内容变化，跳过（不开 PR、不改 main）
          if git diff --quiet "origin/main..HEAD" -- . ':(exclude)src/content'; then
            echo "上游仅更新了内容，无代码改动，跳过。"
            exit 0
          fi

          # 有实际代码改动 → 推分支、开/更新 PR，交给你用 Vercel 预览验收后合并
          git push -f origin sync/upstream
          PR_BODY="自动合并上游 yuhangch/yuhang.ch 最新代码（已自动保留你的私有内容指针）。请查看本 PR 的 Vercel 预览，确认无误后点 Merge。"
          if gh pr view sync/upstream >/dev/null 2>&1; then
            gh pr edit sync/upstream --title "🔄 同步上游 yuhangch（自动）" --body "$PR_BODY"
          else
            gh pr create --base main --head sync/upstream --title "🔄 同步上游 yuhangch（自动）" --body "$PR_BODY"
          fi
          echo "已开/更新 PR，等你验收合并。"
